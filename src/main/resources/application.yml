server:
  port: 8083

spring:
  application:
    name: ms-kafka-admin

app:
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092,localhost:9093,localhost:9094}
    # Tópicos que se crean al iniciar si no existen (3 particiones y 3 réplicas cada uno)
    topics:
      - name: pedidos.eventos          # flujo de eventos: se conserva 7 días
        partitions: 3
        replication-factor: 3
        cleanup-policy: delete
        retention-ms: 604800000
        min-insync-replicas: 2
      - name: pedidos.estado           # último estado por pedido (clave = id): compactado
        partitions: 3
        replication-factor: 3
        cleanup-policy: compact
        retention-ms: -1
        min-insync-replicas: 2

logging:
  level:
    cl.tnt.kafkaadmin: DEBUG
    org.apache.kafka: WARN
